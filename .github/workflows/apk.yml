name: Android APK (deneme sürümü)

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Android projesini al
        uses: actions/checkout@v4

      - name: Rehberin güncel web sürümünü al (main dalı)
        uses: actions/checkout@v4
        with:
          ref: main
          path: web

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paketleri kur ve içeriği kopyala
        run: |
          npm ci
          node hazirla.js web
          npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: hayatta-kal-deneme-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: APK'yı "apk" dalına koy (doğrudan indirme bağlantısı için)
        run: |
          mkdir cikti && cp android/app/build/outputs/apk/debug/app-debug.apk cikti/hayatta-kal-deneme.apk
          cd cikti
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add hayatta-kal-deneme.apk
          git commit -qm "Deneme APK'sı (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
